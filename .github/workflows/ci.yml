name: CI

# Roda a suite de testes em cada push e PR. Sem isto, os testes só rodavam
# localmente — qualidade não automatizada, na prática, não existe.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # config.py exige SUPABASE_URL/KEY no import (fail-fast em produção). Os
    # testes são puros (não abrem conexão), então valores dummy destravam o
    # import sem expor secret nem tocar o banco.
    env:
      SUPABASE_URL: http://localhost:54321
      SUPABASE_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install (dev + avm extras)
        run: pip install -e ".[dev,avm]"
      - name: Tests
        run: pytest -q
      - name: Lint (ruff, informativo)
        continue-on-error: true
        run: ruff check src tests
