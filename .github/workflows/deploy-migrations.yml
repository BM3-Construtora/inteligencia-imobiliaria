name: Deploy Migrations (CD)

# Aplica migrations pendentes em produção quando chegam na main.
# Pré-requisitos (ver docs/adr/0001-cd-migrations-supabase-cli.md):
#   1. migrations reorganizadas em supabase/migrations/ (script dedicado)
#   2. secrets configurados: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
#      SUPABASE_PROJECT_REF
#   3. baseline feito (supabase migration repair) — senão o push tentaria
#      reaplicar tudo.
# Antes disso, o guard abaixo faz o job sair limpo sem tocar o banco.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Guard — só segue se houver migrations e secrets
        id: guard
        run: |
          if [ ! -d supabase/migrations ] || [ -z "$(ls -A supabase/migrations 2>/dev/null)" ]; then
            echo "Sem supabase/migrations/ ainda — reorganização pendente. Saindo limpo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "SUPABASE_PROJECT_REF não configurado — CD inativo. Saindo limpo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.guard.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        if: steps.guard.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push pending migrations
        if: steps.guard.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
