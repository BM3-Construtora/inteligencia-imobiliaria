name: Municipal Data Pipeline

# Dados municipais mudam devagar — semanal é suficiente.
# Domingo 07:00 BRT = 10:00 UTC
on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
  VERTEX_LOCATION: ${{ secrets.VERTEX_LOCATION }}

jobs:
  dom-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - name: Collect Alvarás (DOM-MAR Seção III-A)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: python -m src.main alvara
      - name: Collect EIVs
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: python -m src.main eiv
      - name: Collect CMDU Atas
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: python -m src.main cmdu
      - name: Monitor Plano Diretor
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: python -m src.main plano-diretor

  spatial-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[geo]"
      - name: Collect OSM POIs
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 2
          command: python -m src.main osm
      - name: Spatial Enrichment (proximity + MCMV score)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: python -m src.main spatial-enrich

  ibge-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[geo]"
      - name: Collect IBGE Census Sectors
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: python -m src.main ibge-sectors

  intelligence-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - name: CEPEA Agronegócio Index
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: python -m src.main agronegocio
      - name: Heritage Detector
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: python -m src.main heritage
      - name: CNPJ Construtoras Enrichment
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: python -m src.main cnpj-construtoras

  embedding-generation:
    needs: [dom-signals]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: ${{ env.GEMINI_API_KEY != '' || env.VERTEX_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - name: Generate Embeddings
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 2
          command: python -m src.main embed 300

  vision-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: ${{ env.GEMINI_API_KEY != '' || env.VERTEX_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - name: Vision Listing Photos
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 2
          command: python -m src.main vision-listings 50

  rating-construtoras:
    needs: [dom-signals]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - name: Calculate Construtoras Rating
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: python -m src.main rating-construtoras

  summary:
    needs: [dom-signals, spatial-layer, ibge-census, rating-construtoras, intelligence-enrichment, embedding-generation, vision-listings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        run: |
          {
            echo "# Municipal Data Pipeline Summary"
            echo ""
            echo "Run: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| dom-signals         | ${{ needs.dom-signals.result }} |"
            echo "| spatial-layer       | ${{ needs.spatial-layer.result }} |"
            echo "| ibge-census         | ${{ needs.ibge-census.result }} |"
            echo "| rating-construtoras | ${{ needs.rating-construtoras.result }} |"
          }
          cat
