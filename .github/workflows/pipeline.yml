name: MaríliaBot Pipeline

on:
  schedule:
    # 06:00 BRT = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  TOCA_SUPABASE_URL: ${{ secrets.TOCA_SUPABASE_URL }}
  TOCA_ANON_KEY: ${{ secrets.TOCA_ANON_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  MAX_PAGES_PER_SPIDER: '20'
  CITY_FOCUS: ${{ vars.CITY_FOCUS }}

jobs:
  # Checa a presença de GEMINI_API_KEY e expõe como output. O contexto `env`
  # não é acessível em `if:` de nível de job, então condicionar os jobs LLM
  # por secret exige um output de job (needs.preflight.outputs.has_gemini).
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_gemini: ${{ steps.check.outputs.has_gemini }}
    steps:
      - id: check
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "has_gemini=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gemini=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - name: Collect APIs
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: python -m src.main collect uniao toca
      - name: Collect scrapers
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 2
          command: python -m src.main collect vivareal chavesnamao imovelweb zapimoveis

  normalize:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 18
          max_attempts: 2
          command: python -m src.main normalize

  classify:
    needs: normalize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 2
          command: python -m src.main classify

  dedup:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: python -m src.main dedup

  enrich:
    needs: [dedup, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    if: ${{ needs.preflight.outputs.has_gemini == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          command: python -m src.main enrich-llm

  analyst:
    needs: dedup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 2
          command: python -m src.main analyze

  trends:
    needs: analyst
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 2
          command: python -m src.main trends

  heat:
    needs: trends
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 2
          command: python -m src.main heat

  hunt:
    needs: [analyst, enrich]
    if: ${{ always() && needs.analyst.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 18
          max_attempts: 2
          command: python -m src.main hunt

  score-llm:
    needs: [hunt, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    if: ${{ needs.preflight.outputs.has_gemini == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 2
          command: python -m src.main score-llm

  risk:
    needs: [hunt, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    if: ${{ needs.preflight.outputs.has_gemini == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 2
          command: python -m src.main risk

  viability:
    needs: hunt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 2
          command: python -m src.main viability

  comps:
    needs: viability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 2
          command: python -m src.main comps

  notify:
    needs: [hunt, viability, comps]
    if: ${{ always() && needs.hunt.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 2
          command: python -m src.main notify

  summary:
    needs: [collect, normalize, classify, dedup, enrich, analyst, trends, heat, hunt, score-llm, risk, viability, comps, notify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        run: |
          mkdir -p out
          {
            echo "# MaríliaBot Pipeline Summary"
            echo ""
            echo "Run: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| collect    | ${{ needs.collect.result }} |"
            echo "| normalize  | ${{ needs.normalize.result }} |"
            echo "| classify   | ${{ needs.classify.result }} |"
            echo "| dedup      | ${{ needs.dedup.result }} |"
            echo "| enrich     | ${{ needs.enrich.result }} |"
            echo "| analyst    | ${{ needs.analyst.result }} |"
            echo "| trends     | ${{ needs.trends.result }} |"
            echo "| heat       | ${{ needs.heat.result }} |"
            echo "| hunt       | ${{ needs.hunt.result }} |"
            echo "| score-llm  | ${{ needs.score-llm.result }} |"
            echo "| risk       | ${{ needs.risk.result }} |"
            echo "| viability  | ${{ needs.viability.result }} |"
            echo "| comps      | ${{ needs.comps.result }} |"
            echo "| notify     | ${{ needs.notify.result }} |"
          } > out/summary.md
          cat out/summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: out/summary.md
