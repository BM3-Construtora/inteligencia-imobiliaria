# Config do Supabase CLI. O project_id abaixo é o ref do projeto; no CI o link
# é feito via `supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}`,
# então este valor serve para uso local (supabase link / db push).
# Substitua pelo ref real do projeto BM3.
project_id = "your-project-ref"

[db]
# Versão do Postgres do projeto (Supabase usa 15 por padrão; ajuste se diferir).
major_version = 15
